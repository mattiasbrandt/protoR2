name: Dependency review

# Every `uses:` is pinned to a full commit SHA with its `# vX.Y.Z`, and a new
# action lands pinned the same way (#473). Dependabot's grouped weekly
# updates move the pins.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-26.04
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🔒 Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec  # v5.0.1
        with:
          # Block newly introduced high or critical vulnerable dependencies.
          # License enforcement is deferred — no audited allowlist exists yet.
          fail-on-severity: high
